<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Geoespacial - Agrupamento e Filtro por Ano</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />

    <style>
      .custom-cluster-icon {
        background: transparent;
        border: none;
      }

      /* Estilização do Tooltip Nativo do Agrupamento */
      .leaflet-tooltip.cluster-custom-tooltip {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        box-shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 8px 10px -6px rgba(0, 0, 0, 0.1);
        padding: 0.25rem;
      }
    </style>
  </head>
  <body class="bg-gray-100 font-sans text-gray-800 flex flex-col h-screen">
    <header
      class="bg-white border-b px-6 py-4 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4 z-10 relative"
    >
      <div class="flex items-center gap-3">
        <!-- Filtro Dinâmico de Ano -->
        <select
          id="yearFilter"
          disabled
          class="bg-gray-50 border border-gray-300 text-gray-700 text-sm rounded-lg p-2.5 disabled:opacity-50"
        >
          <option value="todos">Todos os Anos</option>
        </select>

        <!-- NOVO: Filtro de Status -->
        <select
          id="statusFilter"
          disabled
"          value="Ativos"
"          class="bg-gray-50 border border-gray-300 text-gray-700 text-sm rounded-lg p-2.5 disabled:opacity-50"
        >
          <option value="todos">Todos status</option>
          <option value="ativo">Ativos</option>
          <option value="inativo">Inativos</option>
          <option value="outro">Outros</option>
        </select>

        <div
          class="flex items-center gap-4 bg-white p-2 rounded-lg shadow-sm border border-gray-200 text-xs"
        >
          <!-- Controle de Raio -->
          <div class="flex items-center gap-1.5">
            <label for="radiusRange" class="font-semibold text-gray-700"
              >Raio:</label
            >
            <input
              type="range"
              id="radiusRange"
              min="10"
              max="100"
              step="10"
              value="40"
              class="w-20 acent-yellow-600"
            />
            <span id="radiusVal" class="font-bold text-indigo-600 w-6">40</span>
          </div>

          <!-- Controle de Zoom de Quebra -->
          <div class="flex items-center gap-1.5">
            <label for="zoomRange" class="font-semibold text-gray-700"
              >Zoom Limite:</label
            >
            <input
              type="range"
              id="zoomRange"
              min="10"
              max="22"
              step="1"
              value="22"
              class="w-20 accent-indigo-600"
            />
            <span id="zoomVal" class="font-bold text-indigo-600 w-6">22</span>
          </div>
        </div>

        <button
          id="btnResetView"
          class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-medium px-3 py-2.5 rounded-lg transition"
        >
          Redefinir Visão
        </button>

        <label
          class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2.5 rounded-lg cursor-pointer transition"
        >
          Upload CSV
          <input type="file" id="csvFileInput" accept=".csv" class="hidden" />
        </label>
      </div>
    </header>
    <!-- Modal de Clientes do Cluster -->
    <div
      id="clusterModal"
      class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden z-[9999] flex items-center justify-center backdrop-blur-sm transition-opacity"
    >
      <div
        class="bg-white rounded-xl shadow-2xl w-11/12 max-w-4xl max-h-[85vh] flex flex-col overflow-hidden"
      >
        <!-- Cabeçalho do Modal -->
        <div
          class="px-5 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center"
        >
          <h2 class="text-lg font-extrabold text-slate-800">
            Detalhes do Agrupamento
            <span
              class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full text-sm ml-2"
              id="modalClusterCount"
              >0</span
            >
          </h2>
          <button
            id="closeModalBtn"
            class="text-gray-400 hover:text-rose-500 transition-colors text-2xl font-bold leading-none"
          >
            &times;
          </button>
        </div>

        <!-- Conteúdo (Listas de Clientes) -->
        <div
          class="p-5 overflow-y-auto bg-white flex-1"
          id="modalClusterContent"
        >
          <!-- As tabelas serão injetadas aqui via JavaScript -->
        </div>
      </div>
    </div>
    <main class="flex-1 relative z-0">
      <div id="map" class="w-full h-full"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script src="./js/data.js"></script>
    <script src="./js/map.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
